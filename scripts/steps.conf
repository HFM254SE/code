# Reihenfolge der Checkpoints. assemble-step.sh vererbt labs/ entlang dieser
# Liste, create-step-branches.sh legt die Branches in dieser Reihenfolge auf
# eine lineare Historie.
#
# Inhaltliche Kette (wichtig für identische Kopien und für git diff):
#   vl01-start → vl01-solution → vl03-llm-client → vl03-evaluation
#   vl03-evaluation → vl04-…-start → vl04-…-solution → vl05-…-start → vl05-…-solution
#   vl03-evaluation → vl06-guardrails → vl08-agent → vl09-oracle
# vl06-guardrails baut auf vl03-evaluation auf, nicht auf den RAG-Steps. In
# der linearen Branch-Historie steht vl05-rag-advanced-solution direkt davor.
# Vergleiche deshalb mit `git diff vl03-evaluation vl06-guardrails`.
STEPS=(
  vl01-start vl01-solution
  vl03-llm-client vl03-evaluation
  vl04-rag-ingestion-pipeline-start
  vl04-rag-ingestion-pipeline-solution
  vl05-rag-advanced-start
  vl05-rag-advanced-solution
  vl06-guardrails
  vl08-agent
  vl09-oracle
)
